<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBook - All Movies</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            background:#020b24;
            color:white;
            overflow-x:hidden;
        }

        .layout{
            display:flex;
            min-height:100vh;
        }

        /* =========================
           SIDEBAR
        ========================== */

        .sidebar{
            width:270px;
            background:#09132d;
            border-right:1px solid rgba(255,255,255,0.05);
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            position:fixed;
            left:0;
            top:0;
            bottom:0;
        }

        .logo{
            padding:28px;
            font-size:20px;
            font-weight:800;
            color:#ff6b00;
            border-bottom:1px solid rgba(255,255,255,0.05);
        }

        .menu{
            padding:25px 0;
        }

        .menu a{
            display:flex;
            align-items:center;
            gap:15px;
            padding:18px 28px;
            color:#94a3b8;
            text-decoration:none;
            transition:0.3s;
            font-size:18px;
        }

        .menu a:hover,
        .menu a.active{
            background:rgba(255,255,255,0.03);
            color:white;
        }

        .logout{
            padding:25px 28px;
            border-top:1px solid rgba(255,255,255,0.05);
        }

        .logout a{
            color:#ff4d4d;
            text-decoration:none;
            font-size:18px;
        }

        /* =========================
           CONTENT
        ========================== */

        .content{
            margin-left:270px;
            width:calc(100% - 270px);
            padding:30px;
        }

        .page-title{
            font-size:64px;
            font-weight:800;
            margin-bottom:10px;
        }

        .page-title i{
            color:#1d7cff;
            margin-right:10px;
        }

        .subtitle{
            color:#94a3b8;
            margin-bottom:35px;
            font-size:18px;
        }

        /* =========================
           SEARCH BAR
        ========================== */

        .search-box{
            background:#1b2742;
            border-radius:22px;
            padding:16px;
            display:flex;
            align-items:center;
            gap:15px;
            margin-bottom:40px;
            flex-wrap:wrap;
        }

        .search-input{
            flex:1;
            display:flex;
            align-items:center;
            background:#081327;
            border:1px solid rgba(255,255,255,0.08);
            border-radius:14px;
            overflow:hidden;
        }

        .search-input span{
            padding:16px;
            color:#1d7cff;
            font-size:20px;
        }

        .search-input input{
            width:100%;
            background:transparent;
            border:none;
            outline:none;
            color:white;
            padding-right:15px;
        }

        .filter-btns{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
        }

        .filter-btn{
            border:none;
            padding:12px 22px;
            border-radius:50px;
            background:#3a4b69;
            color:white;
            font-weight:600;
            transition:0.3s;
        }

        .filter-btn.active,
        .filter-btn:hover{
            background:#ff7a18;
        }

        /* =========================
           MOVIES GRID
        ========================== */

        .movies-grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
            gap:25px;
        }

        .movie-card{
            background:#15203a;
            border-radius:22px;
            overflow:hidden;
            transition:0.35s;
            cursor:pointer;
            border:1px solid rgba(255,255,255,0.05);
        }

        .movie-card:hover{
            transform:translateY(-10px);
            box-shadow:0 15px 40px rgba(0,0,0,0.45);
        }

        .movie-image{
            width:100%;
            height:340px;
            overflow:hidden;
            position:relative;
            background:#0f172a;
        }

        .movie-image img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .rating{
            position:absolute;
            top:15px;
            right:15px;
            background:rgba(0,0,0,0.7);
            color:#ffc107;
            padding:6px 12px;
            border-radius:50px;
            font-size:14px;
            font-weight:600;
        }

        .movie-info{
            padding:20px;
        }

        .movie-title{
            font-size:22px;
            font-weight:700;
            margin-bottom:8px;
        }

        .movie-meta{
            color:#94a3b8;
            margin-bottom:18px;
            font-size:14px;
        }

        .movie-bottom{
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .bookings{
            color:#94a3b8;
            font-size:14px;
        }

        .book-btn{
            border:none;
            background:#1d7cff;
            color:white;
            padding:10px 16px;
            border-radius:10px;
            font-weight:600;
            transition:0.3s;
        }

        .book-btn:hover{
            background:#005eff;
        }

        /* =========================
           LOADER
        ========================== */

        .loader{
            text-align:center;
            padding:100px 0;
        }

        .loader .spinner-border{
            width:60px;
            height:60px;
        }

        .loader p{
            margin-top:20px;
            color:#94a3b8;
            font-size:22px;
        }

        /* =========================
           MOBILE
        ========================== */

        @media(max-width:992px){

            .sidebar{
                display:none;
            }

            .content{
                width:100%;
                margin-left:0;
            }

            .page-title{
                font-size:42px;
            }

        }

    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div>

            <div class="logo">
                <i class="fa-solid fa-crown"></i>
                ADMIN PANEL
            </div>

            <div class="menu">

                <a href="#">
                    <i class="fa-solid fa-chart-line"></i>
                    Overview
                </a>

                <a href="#">
                    <i class="fa-solid fa-users"></i>
                    Manage Users
                </a>

                <a href="#" class="active">
                    <i class="fa-solid fa-film"></i>
                    Manage Movies
                </a>

                <a href="#">
                    <i class="fa-solid fa-ticket"></i>
                    All Bookings
                </a>

                <a href="#">
                    <i class="fa-solid fa-money-bill-wave"></i>
                    Payments
                </a>

            </div>

        </div>

        <div class="logout">
            <a href="#">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>
        </div>

    </div>

    <!-- CONTENT -->

    <div class="content">

        <h1 class="page-title">
            <i class="fa-solid fa-film"></i>
            All Movies
        </h1>

        <p class="subtitle">
            Discover the latest releases and book your tickets
        </p>

        <!-- SEARCH -->

        <div class="search-box">

            <div class="search-input">
                <span>
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>

                <input
                        type="text"
                        id="searchInput"
                        placeholder="Search by movie title..."
                >
            </div>

            <div class="filter-btns">

                <button class="filter-btn active" data-filter="all">
                    All Movies
                </button>

                <button class="filter-btn" data-filter="now-showing">
                    Now Showing
                </button>

                <button class="filter-btn" data-filter="popular">
                    Popular
                </button>

            </div>

        </div>

        <!-- MOVIES -->

        <div id="moviesContainer">

            <div class="loader">

                <div class="spinner-border text-primary"></div>

                <p>Loading movies...</p>

            </div>

        </div>

    </div>

</div>

<!-- JQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>

    let allMovies = [];
    let currentFilter = "all";
    let searchTerm = "";

    // =========================
    // LOAD MOVIES
    // =========================

    function loadMovies(){

        $.ajax({

            url:"http://localhost:8080/api/movies/allMovies",
            method:"GET",

            success:function(response){

                console.log("Movies Loaded:", response);

                if(Array.isArray(response)){
                    allMovies = response;
                }
                else if(response.data){
                    allMovies = response.data;
                }
                else{
                    allMovies = [];
                }

                filterMovies();
            },

            error:function(xhr,error){

                console.log(error);

                $("#moviesContainer").html(`

                    <div class="text-center py-5">

                        <h2 class="text-danger">
                            Failed to Load Movies
                        </h2>

                    </div>

                `);

            }

        });

    }

    // =========================
    // FILTER MOVIES
    // =========================

    function filterMovies(){

        let filtered = [...allMovies];

        // Search

        if(searchTerm){

            filtered = filtered.filter(movie =>

                movie.title &&
                movie.title.toLowerCase()
                    .includes(searchTerm.toLowerCase())

            );

        }

        // Popular

        if(currentFilter === "popular"){

            filtered.sort((a,b)=>

                (b.totalBookings || 0)
                -
                (a.totalBookings || 0)

            );

        }

        displayMovies(filtered);

    }

    // =========================
    // DISPLAY MOVIES
    // =========================

    function displayMovies(movies){

        if(!movies || movies.length === 0){

            $("#moviesContainer").html(`

                <div class="text-center py-5">

                    <i class="fa-solid fa-film fa-4x mb-4 text-secondary"></i>

                    <h2>No Movies Found</h2>

                </div>

            `);

            return;

        }

        let html = `<div class="movies-grid">`;

        movies.forEach(movie => {

            html += `

                <div class="movie-card">

                    <div class="movie-image">

                        ${
                movie.posterUrl ?

                    `<img src="${movie.posterUrl}" alt="">`

                    :

                    `<img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop">`
            }

                        <div class="rating">

                            <i class="fa-solid fa-star"></i>

                            ${movie.rating || "4.5"}

                        </div>

                    </div>

                    <div class="movie-info">

                        <div class="movie-title">

                            ${movie.title || "Movie Title"}

                        </div>

                        <div class="movie-meta">

                            ${movie.duration || 120} min •
                            ${movie.genre || "Action"}

                        </div>

                        <div class="movie-bottom">

                            <div class="bookings">

                                <i class="fa-solid fa-ticket"></i>

                                ${movie.totalBookings || 0} bookings

                            </div>

                            <button class="book-btn">

                                Book Now

                            </button>

                        </div>

                    </div>

                </div>

            `;

        });

        html += `</div>`;

        $("#moviesContainer").html(html);

    }

    // =========================
    // SEARCH
    // =========================

    $("#searchInput").on("input",function(){

        searchTerm = $(this).val();

        filterMovies();

    });

    // =========================
    // FILTER BUTTONS
    // =========================

    $(document).on("click",".filter-btn",function(){

        $(".filter-btn").removeClass("active");

        $(this).addClass("active");

        currentFilter = $(this).data("filter");

        filterMovies();

    });

    // =========================
    // INITIAL LOAD
    // =========================

    $(document).ready(function(){

        loadMovies();

    });

</script>

</body>
</html>
